<rect x="632.0" y="387.0" width="376" height="126" rx="18" fill="none" stroke="#22C55E" stroke-width="3" opacity="0.5"/>
<rect x="640.0" y="395.0" width="360" height="110" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="3.5"/>
<text x="820" y="428" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">pet-service  :8083</text>
<text x="820" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">판정 입력값의 소유자 — 체중 · 장비 · 접종</text>
<text x="820" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">API 11개  (공개 7 · internal 2 · 관리자 2)</text>
<text x="632.0" y="381.0" font-size="13" font-weight="bold" text-anchor="start" fill="#22C55E">이 레포</text>
<rect x="60.0" y="405.0" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2"/>
<text x="180" y="428" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">gateway-server</text>
<text x="180" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">토큰 검증</text>
<text x="180" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">X-User-Id · X-User-Role 주입</text>
<rect x="670.0" y="80.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="820" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">config-server</text>
<text x="820" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">포트 · DB · S3 키</text>
<rect x="1410.0" y="80.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="1560" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">eureka-server</text>
<text x="1560" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">등록 · lb:// 해석</text>
<rect x="1410.0" y="245.0" width="300" height="110" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="1560" y="270" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">PostgreSQL  pet_db</text>
<text x="1560" y="290" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">pet · breed  (표 2개 + outbox · inbox)</text>
<text x="1560" y="306" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">견종 마스터 45행 — 맹견 5종 포함</text>
<text x="1560" y="322" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">크기는 체중에서 계산해 채움</text>
<rect x="60.0" y="110.0" width="240" height="80" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.2"/>
<text x="180" y="128" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">AWS S3</text>
<text x="180" y="148" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">반려동물 사진</text>
<text x="180" y="164" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">브라우저가 직접 올림</text>
<rect x="1410.0" y="565.0" width="300" height="110" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="1560" y="590" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">review-service</text>
<text x="1560" y="610" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">후기를 쓸 때 견종 · 체중을</text>
<text x="1560" y="626" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">스냅샷으로 복사해 감</text>
<text x="1560" y="642" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">아직 없음</text>
<rect x="60.0" y="650.0" width="240" height="100" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="180" y="670" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">verdict-service</text>
<text x="180" y="690" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">판정 재료로</text>
<text x="180" y="706" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">이 반려동물을 물어봄</text>
<text x="180" y="722" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">아직 없음</text>
<rect x="550.0" y="770.0" width="300" height="80" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="700" y="788" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Kafka</text>
<text x="700" y="808" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">pet.profile.updated 발행</text>
<text x="700" y="824" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">account.withdrawn 수신</text>
<rect x="1150.0" y="770.0" width="300" height="80" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1300" y="796" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">auth-service</text>
<text x="1300" y="816" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">탈퇴를 알림</text>
