<rect x="428" y="422" width="103" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="480" y="434" font-size="13" font-weight="normal" text-anchor="middle" fill="#3B82F6">공개 7 · 관리자 2</text>
<polyline points="820,160.0 820,395.0" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="782" y="258" width="76" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="820.0" y="269.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#6366F1">기동 시 설정</text>
<polyline points="1000.0,450 1120,450 1120,120 1410.0,120" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="1183" y="193" width="34" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1200" y="205" font-size="13" font-weight="normal" text-anchor="middle" fill="#6366F1">등록</text>
<polyline points="1000.0,450 1120,450 1120,300 1410.0,300" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="1133" y="366" width="134" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1200" y="378" font-size="13" font-weight="normal" text-anchor="middle" fill="#F97316">JPA · Flyway V20~21</text>
<polyline points="1410,590 1260,590 1260,470 1000,470" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)" stroke-dasharray="7,6"/>
<rect x="1268" y="533" width="285" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1272" y="545" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">GET /internal/pets?ids=   상한 100 · 소유권 검증</text>
<polyline points="300.0,700 480,700 480,480 640,480" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)" stroke-dasharray="7,6"/>
<rect x="490" y="580" width="167" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="494" y="592" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">GET /internal/pets/{petId}</text>
<polyline points="900,505 900,660 790,660 790,770" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="908" y="588" width="96" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="912" y="600" font-size="13" font-weight="normal" text-anchor="start" fill="#F97316">Outbox 로 발행</text>
<polyline points="610,770 610,620 700,620 700,505" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="406" y="620" width="196" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="598" y="632" font-size="13" font-weight="normal" text-anchor="end" fill="#F97316">account.withdrawn 을 받아 지움</text>
<polyline points="1150.0,810 850.0,810" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)"/>
<rect x="1006" y="790" width="127" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1010" y="802" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">account.withdrawn</text>
<polyline points="640,398 430,398 430,150 300.0,150" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)" stroke-dasharray="7,6"/>
<rect x="488" y="288" width="178" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="492" y="300" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">주소만 발급 · 탈퇴 시 객체 삭제</text>
<text x="40" y="880" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">크기는 견종이 아니라 체중으로만 가름 — SMALL 10kg 미만 · MEDIUM 10~25kg 미만 · LARGE 25kg 이상 · 서버가 채우되 사용자가 고친 값이 이김</text>
<text x="40" y="902" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">견종 마스터는 맹견 판정과 종 구분에만 쓰임 — 크기 기본값 컬럼을 두지 않아 견종을 늘리거나 줄여도 판정이 달라지지 않음</text>
<text x="40" y="924" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">내어 주는 두 API 는 소유권 검증이 필수임 — 없으면 아무 식별자나 넣어 남의 반려동물 기준으로 판정을 받아볼 수 있음</text>
<text x="1836" y="948" font-size="11" text-anchor="end" fill="#9CA3AF">pet-service 를 중심으로 · 직접 연결된 것만</text></svg>